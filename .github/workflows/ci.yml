name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Get Mathlib cache
        run: scripts/lake.sh exe cache get || true

      - name: Repo lint (TorchLean policies)
        run: scripts/lake.sh lint

      - name: Clean curated library build artifacts
        run: scripts/lake.sh clean

      - name: Build library, CI, examples, tests, and native commands
        run: |
          scripts/lake.sh build NN NNCI NNExamples NNTests \
            torchlean verify native_float32_parity pytorch_export_check

      - name: Run curated test suite
        run: scripts/lake.sh test

      - name: Check native commands
        run: |
          scripts/lake.sh exe torchlean quickstart_tensors
          scripts/lake.sh exe verify -- list
          scripts/lake.sh exe native_float32_parity
