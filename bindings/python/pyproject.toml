[project]
name = "torchlean-native"
version = "0.1.0"
description = "Optional native Python access to TorchLean's IR checker"
requires-python = ">=3.14"

[build-system]
requires = ["setuptools>=82", "setuptools-lean>=0.2.0.dev0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[[tool.setuptools-lean.ext-modules]]
lean-module = "TorchLeanPython"
