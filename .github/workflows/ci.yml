name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install elan
        run: curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y

      - name: Get Mathlib cache
        run: ~/.elan/bin/lake exe cache get || true

      - name: Repo lint (TorchLean policies)
        run: ~/.elan/bin/lake lint

      - name: Clean curated library build artifacts
        run: ~/.elan/bin/lake clean

      - name: Build maintained library, CI, example, and test modules
        run: ~/.elan/bin/lake build NN NNCI NNExamples NNTests

      - name: Run curated test suite
        run: ~/.elan/bin/lake test

      # Runs against a recording stand-in for nvcc, so this needs no CUDA toolkit and no GPU.
      - name: Check the CUDA compilation target
        run: LAKE=~/.elan/bin/lake scripts/checks/cuda_arch_target.sh
