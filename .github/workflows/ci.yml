name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      lean: ${{ steps.select.outputs.lean }}
      citation: ${{ steps.select.outputs.citation }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select checks
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          event = os.environ['EVENT']
          before = os.environ['BEFORE']
          full = event == 'workflow_dispatch' or (
              event == 'push' and (not before or set(before) == {'0'})
          )
          paths = []
          if not full:
              base = os.environ['BASE'] if event == 'pull_request' else before
              paths = subprocess.check_output([
                  'git', 'diff', '--name-only', '--no-renames', '-z',
                  base, os.environ['HEAD'],
              ]).decode().rstrip('\0').split('\0')

          def lightweight(path):
              return (
                  path == 'CITATION.cff'
                  or path.endswith('.md')
                  or path in {
                      'scripts/verification/abcrown/export_leaf_artifact.py',
                      'scripts/verification/abcrown/test_export_leaf_artifact.py',
                  }
              )

          lean = full or any(path and not lightweight(path) for path in paths)
          citation = full or 'CITATION.cff' in paths
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'lean={str(lean).lower()}\n')
              output.write(f'citation={str(citation).lower()}\n')
          print(f'Full Lean build: {lean}; citation validation: {citation}')
          PY

  build_and_test:
    name: CPU build and checks
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    env:
      TORCHLEAN_REQUIRE_INTEROP: "1"
      TORCHLEAN_REQUIRE_CUDA: "0"
      TORCHLEAN_BUILD_PROFILE: cpu
    # A metadata-only push must not cancel a source build that is still running.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ needs.changes.outputs.lean }}
      cancel-in-progress: true
    steps:
      - name: Require successful change detection
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repo lint (TorchLean policies)
        run: python3 scripts/checks/repo_lint.py --fail-on-warn

      - name: Check build script syntax
        run: |
          bash -n scripts/lake.sh scripts/checks/check.sh scripts/checks/cuda_sanitize_tests.sh
          python3 - <<'PY'
          import ast
          from pathlib import Path
          source = Path('scripts/libtorch_build.py')
          ast.parse(source.read_text(), filename=str(source))
          PY

      - name: Test leaf artifact exporter
        run: python3 -B -m unittest discover -s scripts/verification/abcrown -p 'test_*.py'

      - name: Test LiRPA certificate regions
        run: python3 -B -m unittest discover -s scripts/verification/lirpa -p 'test_*.py'

      - name: Test documentation links and dependency checks
        run: |
          python3 -B -m unittest discover -s scripts/docs -p 'test_*.py'
          python3 -B -m unittest discover -s scripts/checks -p 'test_*.py'

      - name: Validate citation metadata
        if: needs.changes.outputs.citation == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/citation-check"
          "$RUNNER_TEMP/citation-check/bin/pip" install cffconvert==2.0.0
          "$RUNNER_TEMP/citation-check/bin/cffconvert" --validate -i CITATION.cff

      - name: Install elan
        if: needs.changes.outputs.lean == 'true'
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Set up interop Python
        if: needs.changes.outputs.lean == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/checks/requirements-interop.txt

      - name: Install and check interop dependencies
        if: needs.changes.outputs.lean == 'true'
        run: |
          python3 -m pip install -r scripts/checks/requirements-interop.txt
          python3 scripts/checks/check_interop_dependencies.py

      - name: Identify native build configuration
        if: needs.changes.outputs.lean == 'true'
        id: native
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import subprocess

          # Native dependency objects are valid only for the same compiler and CPU profile.
          configuration = b'cpu;cuda=false;libtorch-sdk=unused\n'
          for compiler in ['cc', 'c++']:
              configuration += subprocess.check_output([compiler, '--version'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('configuration=' + hashlib.sha256(configuration).hexdigest() + '\n')
          PY

      - name: Restore compiled dependencies
        if: needs.changes.outputs.lean == 'true'
        uses: actions/cache@v4
        with:
          # Package sources and their native/Lean outputs travel together. TorchLean's own
          # profile caches live outside the checkout and are intentionally rebuilt.
          path: .lake/packages
          key: lean-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.native.outputs.configuration }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean', 'scripts/lake.sh') }}

      - name: Get Mathlib cache
        if: needs.changes.outputs.lean == 'true'
        run: scripts/lake.sh -Kcuda=false exe cache get || true

      - name: Build CPU library, CI, examples, tests, and native commands
        if: needs.changes.outputs.lean == 'true'
        run: |
          scripts/lake.sh -Kcuda=false build NN NNCI NNExamples NNTests \
            torchlean verify native_float32_parity pytorch_export_check

      - name: Run curated CPU test suite
        if: needs.changes.outputs.lean == 'true'
        run: scripts/lake.sh -Kcuda=false test

      - name: Check CPU native commands
        if: needs.changes.outputs.lean == 'true'
        run: |
          scripts/lake.sh -Kcuda=false exe torchlean quickstart_tensors
          scripts/lake.sh -Kcuda=false exe verify -- all
          scripts/lake.sh -Kcuda=false exe native_float32_parity
          scripts/lake.sh -Kcuda=false exe pytorch_export_check
