name: Publish documentation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      rebuild_lean_docs:
        description: Rebuild Lean documentation (API, guide and dependency graphs)
        type: boolean
        default: false

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_project:
    runs-on: ubuntu-latest
    name: Build project
    env:
      # scripts/docs/build_site.sh builds and checks the site for its published base URL.
      JEKYLL_ENV: production
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reuse generated documentation
        id: generated_docs
        uses: actions/cache/restore@v4
        with:
          path: |
            home_page/docs
            _out/blueprint/html-multi
            home_page/importgraph/index.html
            home_page/graphs/dependency-audit.json
          key: GeneratedDocs-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: GeneratedDocs-v1-${{ runner.os }}-

      - name: Restore published documentation if the cache expired
        if: ${{ !inputs.rebuild_lean_docs && steps.generated_docs.outputs.cache-matched-key == '' }}
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://lean-dojo.github.io/TorchLean/generated-docs.tar.gz \
            --output "$RUNNER_TEMP/generated-docs.tar.gz"
          tar --extract --gzip --file "$RUNNER_TEMP/generated-docs.tar.gz" --no-same-owner -- \
            home_page/docs _out/blueprint/html-multi \
            home_page/importgraph/index.html home_page/graphs/dependency-audit.json

      - name: Free runner disk space
        if: inputs.rebuild_lean_docs
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          rm -rf ~/.cache/mathlib
          df -h

      - name: Install elan
        if: inputs.rebuild_lean_docs
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Get Mathlib cache
        if: inputs.rebuild_lean_docs
        run: |
          scripts/lake.sh -Kcuda=false exe cache get || true
          rm -f ~/.cache/mathlib/*.ltar || true

      - name: Build project API documentation
        if: inputs.rebuild_lean_docs
        run: scripts/docs/build_site.sh api

      - name: Build Verso guide from `home_page/blueprint`
        if: inputs.rebuild_lean_docs
        run: |
          TORCHLEAN_PACKAGE_ROOT="$PWD/home_page/blueprint" scripts/lake.sh exe cache get || true
          rm -f ~/.cache/mathlib/*.ltar || true
          scripts/docs/build_site.sh guide

      - name: Build dependency graphs
        if: inputs.rebuild_lean_docs
        run: scripts/docs/build_site.sh graphs

      - name: Bundle dependencies
        uses: ruby/setup-ruby@v1
        with:
          working-directory: home_page
          ruby-version: "3.3"
          bundler-cache: true

      - name: Refresh build timing history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/docs/build_site.sh timings

      - name: Build website using Jekyll
        env:
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/docs/build_site.sh website

      - name: Check generated links and anchors
        run: scripts/docs/build_site.sh links

      - name: Save regenerated documentation
        if: inputs.rebuild_lean_docs
        uses: actions/cache/save@v4
        with:
          path: |
            home_page/docs
            _out/blueprint/html-multi
            home_page/importgraph/index.html
            home_page/graphs/dependency-audit.json
          key: ${{ steps.generated_docs.outputs.cache-primary-key }}

      - name: Keep generated documentation with the published site
        run: |
          tar --create --gzip --file home_page/_site/generated-docs.tar.gz \
            home_page/docs _out/blueprint/html-multi \
            home_page/importgraph/index.html home_page/graphs/dependency-audit.json

      - name: "Upload website (API documentation, blueprint and any home page)"
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: home_page/_site

  deploy_pages:
    runs-on: ubuntu-latest
    name: Deploy GitHub Pages
    needs: build_project
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
