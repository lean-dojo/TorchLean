name: Publish documentation

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/blueprint.yml"
      - "**/*.lean"
      - "csrc/**"
      - "home_page/**"
      - "docs/**"
      - "scripts/**"
      - "lakefile.lean"
      - "lake-manifest.json"
      - "lean-toolchain"
      - "README.md"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/blueprint.yml"
      - "**/*.lean"
      - "csrc/**"
      - "home_page/**"
      - "docs/**"
      - "scripts/**"
      - "lakefile.lean"
      - "lake-manifest.json"
      - "lean-toolchain"
      - "README.md"
  workflow_dispatch:

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_project:
    runs-on: ubuntu-latest
    name: Build project
    env:
      # scripts/docs/build_site.sh builds and checks the site for its published base URL.
      JEKYLL_ENV: production
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reuse generated documentation
        id: generated_docs
        uses: actions/cache@v4
        with:
          path: |
            home_page/docs
            _out/blueprint/html-multi
            home_page/importgraph/index.html
            home_page/graphs/dependency-audit.json
          # Exact matches only: changed Lean, guide assets, dependencies or build tools
          # must regenerate these pages. Ordinary Jekyll prose and styles can reuse them.
          key: GeneratedDocs-v1-${{ runner.os }}-${{ hashFiles('**/*.lean', '**/lake-manifest.json', '**/lean-toolchain', 'csrc/**', 'scripts/**', 'home_page/blueprint/**', '.github/workflows/blueprint.yml', '!.lake/**', '!**/.lake/**', '!_out/**') }}

      - name: Free runner disk space
        if: steps.generated_docs.outputs.cache-hit != 'true'
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          rm -rf ~/.cache/mathlib
          df -h

      - name: Install elan
        if: steps.generated_docs.outputs.cache-hit != 'true'
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Get Mathlib cache
        if: steps.generated_docs.outputs.cache-hit != 'true'
        run: |
          scripts/lake.sh -Kcuda=false exe cache get || true
          rm -f ~/.cache/mathlib/*.ltar || true

      - name: Build project API documentation
        if: steps.generated_docs.outputs.cache-hit != 'true'
        run: scripts/docs/build_site.sh api

      - name: Build Verso guide from `home_page/blueprint`
        if: steps.generated_docs.outputs.cache-hit != 'true'
        run: |
          TORCHLEAN_PACKAGE_ROOT="$PWD/home_page/blueprint" scripts/lake.sh exe cache get || true
          rm -f ~/.cache/mathlib/*.ltar || true
          scripts/docs/build_site.sh guide

      - name: Build dependency graphs
        if: steps.generated_docs.outputs.cache-hit != 'true'
        run: scripts/docs/build_site.sh graphs

      - name: Bundle dependencies
        uses: ruby/setup-ruby@v1
        with:
          working-directory: home_page
          ruby-version: "3.3"
          bundler-cache: true

      - name: Refresh build timing history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/docs/build_site.sh timings

      - name: Build website using Jekyll
        env:
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/docs/build_site.sh website

      - name: Check generated links and anchors
        run: scripts/docs/build_site.sh links

      - name: "Upload website (API documentation, blueprint and any home page)"
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: home_page/_site

  deploy_pages:
    runs-on: ubuntu-latest
    name: Deploy GitHub Pages
    needs: build_project
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
